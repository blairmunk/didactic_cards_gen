<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предпросмотр LaTeX</title>
    <link rel="stylesheet" href="{{ url_for('cards.static', filename='cards/style.css') }}">
</head>
<body>
    <div class="breadcrumb">
        <a href="{{ url_for('cards.decks_list') }}">📚 Мои колоды</a>
        {% if deck %} → <a href="{{ url_for('cards.deck_view', deck_id=deck.id) }}">{{ deck.name }}</a>{% endif %}
        → LaTeX
    </div>

    <h1>👁 Предпросмотр LaTeX-кода</h1>

    <pre id="latex-code">{{ latex_content }}</pre>

    <div class="buttons" style="margin-top:16px">
        <button class="btn-copy" onclick="copyLatex()">📋 Копировать код</button>
        {% if deck %}
        <a href="{{ url_for('cards.deck_view', deck_id=deck.id) }}" class="btn-secondary" style="text-decoration:none;">← Назад к колоде</a>
        {% endif %}
        <a href="{{ url_for('cards.decks_list') }}" class="btn-secondary" style="text-decoration:none;">← Все колоды</a>
    </div>

    <script>
        function copyLatex() {
            const code = document.getElementById('latex-code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('LaTeX-код скопирован в буфер обмена!');
            });
        }
    </script>
</body>
</html>
