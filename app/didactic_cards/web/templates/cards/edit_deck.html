<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование колоды</title>
    <link rel="stylesheet" href="{{ url_for('cards.static', filename='cards/style.css') }}">
    <link rel="icon" href="{{ url_for('cards.static', filename='cards/favicon.svg') }}" type="image/svg+xml">
</head>
<body>
    <div class="breadcrumb">
        <a href="{{ url_for('cards.decks_list') }}">📚 Мои колоды</a> → Редактирование
    </div>

    <h1>✏️ Редактирование колоды</h1>

    <div class="card-form">
        <form method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Название:</label>
                    <input type="text" id="name" name="name" value="{{ deck.name }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Описание:</label>
                    <input type="text" id="description" name="description" value="{{ deck.description }}">
                </div>
            </div>
            <div class="buttons">
                <button type="submit" class="btn-primary">💾 Сохранить</button>
                <a href="{{ url_for('cards.decks_list') }}" class="btn-secondary" style="text-decoration:none;">← Назад</a>
            </div>
        </form>
    </div>
</body>
</html>
