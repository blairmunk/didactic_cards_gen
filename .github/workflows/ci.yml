name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m "not integration" -q

  print-integration:
    name: LaTeX integration and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install TeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            poppler-utils \
            texlive-lang-cyrillic \
            texlive-latex-base \
            texlive-latex-extra
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run complete suite with branch coverage
        run: >-
          python -m pytest
          --cov=didactic_cards
          --cov=run
          --cov=config
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=98
          -q
