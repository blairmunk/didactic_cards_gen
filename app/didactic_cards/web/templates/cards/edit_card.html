<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование карточки</title>
    <link rel="stylesheet" href="{{ url_for('cards.static', filename='cards/style.css') }}">
    <script>
    window.MathJax = {
        tex: {
            inlineMath:  [['$', '$'], ['\$', '\$']],
            displayMath: [['$$', '$$'], ['\$', '\$']]
        },
        startup: { pageReady: () => MathJax.startup.defaultPageReady() }
    };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
    <div class="breadcrumb">
        <a href="{{ url_for('cards.decks_list') }}">📚 Мои колоды</a> →
        <a href="{{ url_for('cards.deck_view', deck_id=deck.id) }}">{{ deck.name }}</a> →
        Карточка #{{ index + 1 }}
    </div>

    <h1>✏️ Редактирование карточки #{{ index + 1 }}</h1>

    <div class="card-form">
        <form method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="version" value="{{ deck.version }}">
            <div class="form-row">
                <div class="form-group">
                    <label for="front">Лицевая сторона:</label>
                    <textarea id="front" name="front">{{ card.front }}</textarea>
                </div>
                <div class="form-group">
                    <label for="back">Обратная сторона:</label>
                    <textarea id="back" name="back">{{ card.back }}</textarea>
                </div>
            </div>
            <div class="buttons">
                <button type="submit" class="btn-primary">💾 Сохранить</button>
                <a href="{{ url_for('cards.deck_view', deck_id=deck.id) }}" class="btn-secondary" style="text-decoration:none;">← Назад</a>
            </div>
        </form>
    </div>

    <!-- Превью -->
    <h2>Превью</h2>
    <div class="preview-grid">
        <div class="preview-card">
            <div class="preview-card-inner">
                <div class="preview-side preview-front">
                    <div class="preview-content mathjax-content" id="previewFront">{{ card.front }}</div>
                    <span class="preview-side-label">задание</span>
                </div>
                <div class="preview-side preview-back">
                    <div class="preview-content mathjax-content" id="previewBack">{{ card.back }}</div>
                    <span class="preview-side-label">решение</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const frontInput = document.getElementById('front');
        const backInput = document.getElementById('back');
        const previewFront = document.getElementById('previewFront');
        const previewBack = document.getElementById('previewBack');
        let timeout;
        function updatePreview() {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                previewFront.textContent = frontInput.value;
                previewBack.textContent = backInput.value;
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([previewFront, previewBack]);
                }
            }, 300);
        }
        frontInput.addEventListener('input', updatePreview);
        backInput.addEventListener('input', updatePreview);
    </script>
</body>
</html>
